<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255,0,0,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,0,0,0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 20%, rgba(255,0,0,0.05) 0%, transparent 50%);
            animation: bgPulse 4s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Matrix Canvas */
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            opacity: 0.15;
        }

        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.15) 0px,
                rgba(0,0,0,0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 3;
            pointer-events: none;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 0%, rgba(0,0,0,0.8) 100%);
            z-index: 4;
            pointer-events: none;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            max-width: 900px;
        }

        /* Glitch Wrapper */
        .glitch-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 40px;
        }

        /* Main HACKED Text */
        .hacked {
            font-size: 8rem;
            font-weight: 900;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 20px;
            position: relative;
            animation: mainGlitch 3s infinite;
            text-shadow: 
                0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 40px #ff0000,
                0 0 80px #ff0000,
                0 0 120px #ff0000;
        }

        /* Glitch Layers */
        .hacked::before,
        .hacked::after {
            content: 'HACKED';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .hacked::before {
            color: #00ff00;
            animation: glitch1 2s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
            transform: translate(-5px, -5px);
            opacity: 0.8;
        }

        .hacked::after {
            color: #0000ff;
            animation: glitch2 2s infinite linear alternate-reverse;
            clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
            transform: translate(5px, 5px);
            opacity: 0.8;
        }

        @keyframes mainGlitch {
            0%, 90%, 100% {
                transform: translate(0);
                filter: none;
            }
            10% {
                transform: translate(-10px, 5px);
                filter: hue-rotate(90deg);
            }
            20% {
                transform: translate(10px, -5px);
                filter: hue-rotate(180deg);
            }
            30% {
                transform: translate(-5px, 10px);
                filter: hue-rotate(270deg);
            }
            40% {
                transform: translate(5px, -10px);
                filter: none;
            }
        }

        @keyframes glitch1 {
            0% { clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%); }
            20% { clip-path: polygon(0 15%, 100% 15%, 100% 50%, 0 50%); }
            40% { clip-path: polygon(0 40%, 100% 40%, 100% 75%, 0 75%); }
            60% { clip-path: polygon(0 60%, 100% 60%, 100% 90%, 0 90%); }
            80% { clip-path: polygon(0 20%, 100% 20%, 100% 55%, 0 55%); }
            100% { clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%); }
        }

        @keyframes glitch2 {
            0% { clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%); }
            20% { clip-path: polygon(0 50%, 100% 50%, 100% 85%, 0 85%); }
            40% { clip-path: polygon(0 25%, 100% 25%, 100% 60%, 0 60%); }
            60% { clip-path: polygon(0 10%, 100% 10%, 100% 45%, 0 45%); }
            80% { clip-path: polygon(0 45%, 100% 45%, 100% 80%, 0 80%); }
            100% { clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%); }
        }

        /* BY SHADOW Text */
        .by-shadow {
            font-size: 3rem;
            color: #fff;
            letter-spacing: 30px;
            margin-top: 30px;
            position: relative;
            animation: shadowPulse 2s infinite;
            text-shadow: 
                0 0 20px #fff,
                0 0 40px #fff,
                0 0 60px #ff0000;
        }

        @keyframes shadowPulse {
            0%, 100% { 
                opacity: 1;
                text-shadow: 
                    0 0 20px #fff,
                    0 0 40px #fff,
                    0 0 60px #ff0000;
            }
            50% { 
                opacity: 0.8;
                text-shadow: 
                    0 0 10px #fff,
                    0 0 20px #ff0000;
            }
        }

        /* Divider */
        .divider {
            width: 400px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ff0000, transparent);
            margin: 50px auto;
            position: relative;
            animation: dividerGlow 2s infinite;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #ff0000;
            border-radius: 50%;
            box-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
            animation: dotPulse 1s infinite;
        }

        @keyframes dividerGlow {
            0%, 100% { box-shadow: 0 0 20px #ff0000; }
            50% { box-shadow: 0 0 40px #ff0000, 0 0 60px #ff0000; }
        }

        @keyframes dotPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.5); }
        }

        /* Message Card */
        .message-card {
            background: linear-gradient(145deg, rgba(20,0,0,0.9), rgba(40,0,0,0.8));
            border: 2px solid #ff0000;
            padding: 40px;
            margin: 40px auto;
            max-width: 600px;
            position: relative;
            box-shadow: 
                0 0 30px rgba(255,0,0,0.3),
                inset 0 0 30px rgba(255,0,0,0.1);
            animation: cardBorder 3s infinite;
        }

        @keyframes cardBorder {
            0%, 100% { 
                border-color: #ff0000;
                box-shadow: 0 0 30px rgba(255,0,0,0.3), inset 0 0 30px rgba(255,0,0,0.1);
            }
            50% { 
                border-color: #ff3333;
                box-shadow: 0 0 50px rgba(255,0,0,0.5), inset 0 0 50px rgba(255,0,0,0.2);
            }
        }

        .message-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff0000, transparent, #ff0000);
            z-index: -1;
            animation: borderRotate 3s linear infinite;
        }

        @keyframes borderRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* Message Text */
        .message {
            font-size: 1.3rem;
            color: #ff6666;
            line-height: 2;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .message span {
            color: #ff0000;
            font-weight: bold;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Skull */
        .skull {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: skullFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px #ff0000);
        }

        @keyframes skullFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Timestamp */
        .timestamp {
            position: fixed;
            bottom: 30px;
            right: 30px;
            color: rgba(255,0,0,0.5);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        /* Corner Decorations */
        .corner {
            position: fixed;
            width: 80px;
            height: 80px;
            border: 3px solid rgba(255,0,0,0.3);
            z-index: 5;
        }

        .corner-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .corner-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .corner-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* Responsive */
        @media (max-width: 768px) {
            .hacked { font-size: 4rem; letter-spacing: 10px; }
            .by-shadow { font-size: 1.5rem; letter-spacing: 15px; }
            .divider { width: 250px; }
            .message-card { padding: 25px; margin: 30px 20px; }
            .message { font-size: 1rem; }
            .corner { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>
    <!-- Background Layers -->
    <div class="bg-animation"></div>
    <canvas id="matrix"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Corners -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Main Content -->
    <div class="container">
        <!-- Skull -->
        <div class="skull">💀</div>

        <!-- HACKED Text -->
        <div class="glitch-wrapper">
            <h1 class="hacked">HACKED</h1>
        </div>

        <!-- BY SHADOW -->
        <div class="by-shadow">BY SHADOW</div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Message Card -->
        <div class="message-card">
            <p class="message">
                This website hacked by <span>SHADOW</span><br>
                Bola tha na <span>BAP</span> se panga na le
            </p>
        </div>
    </div>

    <!-- Timestamp -->
    <div class="timestamp" id="timestamp"></div>

    <!-- Matrix Script -->
    <script>
        // Matrix Rain
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'アイウエオカキクケコサシスセソ0123456789ABCDEF@#$%&*SHADOW';
        const charArray = chars.split('');
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ff0000';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = charArray[Math.floor(Math.random() * charArray.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        // Timestamp
        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = 
                now.toISOString().replace('T', ' ').slice(0, 19);
        }
        updateTimestamp();
        setInterval(updateTimestamp, 1000);

        // Resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
