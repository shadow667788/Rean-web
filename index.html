<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKED BY SHADOW</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Matrix Rain Effect */
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.3;
        }

        /* Glitch Container */
        .glitch-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        /* Main Hacked Text */
        .hacked-text {
            font-size: 8rem;
            font-weight: bold;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 10px;
            position: relative;
            animation: glitch 2s infinite;
            text-shadow: 
                0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 40px #ff0000,
                0 0 80px #ff0000;
        }

        /* Glitch Animation */
        @keyframes glitch {
            0%, 90%, 100% {
                transform: translate(0);
                text-shadow: 
                    0 0 10px #ff0000,
                    0 0 20px #ff0000,
                    0 0 40px #ff0000;
            }
            10% {
                transform: translate(-5px, 5px);
                text-shadow: 
                    -5px 0 #00ff00,
                    5px 0 #0000ff;
            }
            20% {
                transform: translate(5px, -5px);
                text-shadow: 
                    5px 0 #00ff00,
                    -5px 0 #0000ff;
            }
            30% {
                transform: translate(-5px, -5px);
                text-shadow: 
                    -5px 0 #ff00ff,
                    5px 0 #00ffff;
            }
            40% {
                transform: translate(5px, 5px);
                text-shadow: 
                    5px 0 #ff00ff,
                    -5px 0 #00ffff;
            }
        }

        /* Shadow Team Text */
        .team-text {
            font-size: 3rem;
            color: #fff;
            margin-top: 30px;
            animation: pulse 2s infinite;
            text-shadow: 0 0 20px #fff;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Message */
        .message {
            font-size: 1.2rem;
            color: #00ff00;
            margin-top: 40px;
            max-width: 600px;
            line-height: 1.8;
            animation: typewriter 4s steps(40) 1s both;
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid #00ff00;
        }

        @keyframes typewriter {
            from { width: 0; }
            to { width: 100%; }
        }

        /* Skull ASCII Art */
        .skull {
            font-size: 1rem;
            color: #ff0000;
            margin-bottom: 30px;
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Warning Box */
        .warning-box {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
            padding: 20px 40px;
            color: #fff;
            font-size: 1rem;
            z-index: 100;
            animation: borderGlow 2s infinite;
        }

        @keyframes borderGlow {
            0%, 100% { box-shadow: 0 0 20px #ff0000; }
            50% { box-shadow: 0 0 40px #ff0000, 0 0 60px #ff0000; }
        }

        /* Scanline Effect */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 255, 0, 0.03) 50%
            );
            background-size: 100% 4px;
            z-index: 50;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hacked-text { font-size: 4rem; letter-spacing: 5px; }
            .team-text { font-size: 1.5rem; }
            .message { font-size: 0.9rem; white-space: normal; }
        }
    </style>
</head>
<body>
    <!-- Matrix Canvas -->
    <canvas id="matrix"></canvas>

    <!-- Scanline Overlay -->
    <div class="scanline"></div>

    <!-- Main Content -->
    <div class="glitch-wrapper">
        <!-- Skull ASCII -->
        <pre class="skull">
    _______
   /       \
  |  x   x  |
  |    ^    |
   \_______/
        </pre>

        <!-- Hacked Text -->
        <h1 class="hacked-text">HACKED</h1>

        <!-- Team Name -->
        <div class="team-text">BY SHADOW</div>

        <!-- Message -->
        <p class="message">YOUR SECURITY IS OUR ENTERTAINMENT. PATCH YOUR VULNERABILITIES.</p>
    </div>

    <!-- Warning -->
    <div class="warning-box">
        ⚠️ THIS IS AN EDUCATIONAL DEMO - UNAUTHORIZED ACCESS IS ILLEGAL ⚠️
    </div>

    <!-- Matrix Rain Script -->
    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = 'アイウエオカキクケコサシスセソ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const charArray = chars.split('');
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = charArray[Math.floor(Math.random() * charArray.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        // Resize handler
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>

    <!-- Auto Play Sound (Optional) -->

        audio.loop = true;
        audio.play().catch(e => console.log('Audio autoplay blocked'));
        */
    </script>
</body>
</html>
