<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Security</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff0040;
            --primary-glow: rgba(255, 0, 64, 0.5);
            --bg-dark: #050505;
            --bg-card: rgba(20, 20, 30, 0.8);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --success: #00ff88;
            --warning: #ffaa00;
            --error: #ff0040;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.03;
            background: 
                linear-gradient(90deg, transparent 50%, var(--primary) 50%),
                linear-gradient(transparent 50%, var(--primary) 50%);
            background-size: 50px 50px;
            animation: bgMove 20s linear infinite;
        }

        @keyframes bgMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* LOADING SCREEN */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.8s, visibility 0.8s;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .logo-container {
            position: relative;
            margin-bottom: 50px;
        }

        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            animation: pulse 2s ease-in-out infinite;
            filter: blur(40px);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        .logo-text {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: 12px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
            background: linear-gradient(135deg, var(--primary) 0%, #ff6b00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-2px, 2px); }
            94% { transform: translate(2px, -2px); }
            96% { transform: translate(-2px, -2px); }
            98% { transform: translate(2px, 2px); }
        }

        .logo-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 10px;
            animation: fadeInUp 1s 0.5s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading Bar */
        .loading-container {
            width: 320px;
            position: relative;
        }

        .loading-bar-bg {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), #ff6b00);
            border-radius: 3px;
            transition: width 0.4s ease;
            position: relative;
            box-shadow: 0 0 20px var(--primary);
        }

        .loading-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 30px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8));
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-30px); }
            100% { transform: translateX(30px); }
        }

        .loading-info {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 12px;
        }

        .loading-status {
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
        }

        .loading-percent {
            color: var(--primary);
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        /* WARNING CARD - Glassmorphism */
        .warning-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s, visibility 0.6s;
            z-index: 50;
        }

        .warning-section.active {
            opacity: 1;
            visibility: visible;
        }

        .warning-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            transform: translateY(30px) scale(0.95);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 0, 64, 0.1),
                0 0 80px rgba(255, 0, 64, 0.15);
            position: relative;
            overflow: hidden;
        }

        .warning-section.active .warning-card {
            transform: translateY(0) scale(1);
        }

        .warning-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            animation: borderGlow 2s infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .warning-icon-wrap {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, var(--primary), #cc0033);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 10px 30px var(--primary-glow);
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .warning-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255, 0, 64, 0.2);
            border: 1px solid var(--primary);
            border-radius: 20px;
            font-size: 11px;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .warning-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .warning-subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* Data Grid */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        .data-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px;
            text-align: left;
            transition: transform 0.2s, border-color 0.2s;
        }

        .data-item:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 0, 64, 0.3);
        }

        .data-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .data-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .data-value.danger {
            color: var(--primary);
        }

        .data-value.success {
            color: var(--success);
        }

        /* CTA Button */
        .cta-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), #cc0033);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 30px var(--primary-glow);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px var(--primary-glow);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        .cta-button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: buttonShine 3s infinite;
        }

        @keyframes buttonShine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        /* TERMINAL */
        .terminal-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.98);
            display: none;
            z-index: 60;
            padding: 20px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }

        .terminal-screen.active {
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 0, 64, 0.2);
            margin-bottom: 20px;
        }

        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .terminal-dot.red { background: #ff5f57; }
        .terminal-dot.yellow { background: #ffbd2e; }
        .terminal-dot.green { background: #28ca42; }

        .terminal-title {
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            margin-left: 10px;
        }

        .terminal-body {
            flex: 1;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.8;
            color: var(--success);
        }

        .terminal-body::-webkit-scrollbar {
            width: 6px;
        }

        .terminal-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .terminal-body::-webkit-scrollbar-thumb {
            background: rgba(255, 0, 64, 0.3);
            border-radius: 3px;
        }

        .t-line {
            opacity: 0;
            animation: lineIn 0.3s forwards;
            display: flex;
            gap: 10px;
        }

        @keyframes lineIn {
            to { opacity: 1; }
        }

        .t-prefix {
            color: var(--primary);
            min-width: 60px;
        }

        .t-success { color: var(--success); }
        .t-warning { color: var(--warning); }
        .t-error { color: var(--error); }
        .t-info { color: #00d4ff; }
        .t-data { color: #ff00ff; }

        /* Chrome Camera Indicator */
        .chrome-indicator {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            background: #202124;
            color: #fff;
            padding: 10px 24px;
            border-radius: 0 0 16px 16px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-100%); }
            to { transform: translateX(-50%) translateY(0); }
        }

        .rec-dot {
            width: 10px;
            height: 10px;
            background: #ea4335;
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        /* Camera Preview */
        .camera-preview {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 280px;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            display: none;
            z-index: 999;
            border: 2px solid var(--primary);
            box-shadow: 0 20px 60px rgba(255, 0, 64, 0.4);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .cam-header {
            background: linear-gradient(135deg, var(--primary), #cc0033);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
        }

        .cam-video-wrap {
            position: relative;
            height: 200px;
        }

        .cam-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cam-scan {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(255, 0, 64, 0.2) 50%,
                transparent 100%
            );
            animation: scanMove 2s linear infinite;
        }

        @keyframes scanMove {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .cam-face-detection {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 150px;
            border: 2px solid var(--success);
            border-radius: 50% 50% 40% 40%;
            opacity: 0.7;
            animation: facePulse 2s infinite;
        }

        @keyframes facePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
        }

        /* Educational Modal */
        .edu-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1001;
        }

        .edu-modal.active {
            display: flex;
        }

        .edu-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            transform: scale(0.9);
            animation: modalIn 0.4s forwards;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        @keyframes modalIn {
            to { transform: scale(1); }
        }

        .edu-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .edu-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--warning);
            margin-bottom: 15px;
        }

        .edu-text {
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .edu-list {
            text-align: left;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .edu-list li {
            list-style: none;
            padding: 10px 0 10px 35px;
            position: relative;
            color: var(--text-muted);
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .edu-list li:last-child {
            border-bottom: none;
        }

        .edu-list li::before {
            content: '⚠️';
            position: absolute;
            left: 0;
            top: 10px;
        }

        .edu-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--warning), #ff8800);
            border: none;
            border-radius: 14px;
            color: #000;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
